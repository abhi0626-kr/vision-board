<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Vision Board</title>
    <meta name="description" content="Vision Board" />
    <meta name="author" content="Vision Board" />
    <link rel="icon" href="https://i.pinimg.com/736x/db/0e/e2/db0ee2de02e731141a8394b059f54c04.jpg" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Vision Board" />
    <meta property="og:description" content="Vision Board" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://i.pinimg.com/736x/db/0e/e2/db0ee2de02e731141a8394b059f54c04.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@VisionBoard" />
    <meta name="twitter:image" content="https://i.pinimg.com/736x/db/0e/e2/db0ee2de02e731141a8394b059f54c04.jpg" />
  </head>

  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#7a6256;background:#fcf9f6;">
        <div style="font-size:24px;font-family:serif;margin-bottom:8px;color:#56332b;">Vision Board</div>
        <div style="font-size:14px;color:#8a7a70;">Loading sanctuary...</div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global script error:', e);
        var root = document.getElementById('root');
        if (root && root.innerHTML.includes('Loading')) {
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#fcf9f6;color:#56332b;padding:24px;text-align:center;">'
            + '<h2 style="font-family:serif;font-size:24px;margin-bottom:8px;color:#b91c1c;">Could not load application</h2>'
            + '<p style="max-width:480px;font-size:14px;color:#6b5e57;background:#fff;padding:12px 16px;border-radius:8px;border:1px solid #e5ded7;word-break:break-word;">' + (e.message || 'Script execution error') + '</p>'
            + '<button onclick="window.location.reload()" style="margin-top:16px;padding:8px 18px;background:#56332b;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;">Reload</button>'
            + '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
